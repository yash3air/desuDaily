<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance Verification</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
    h2 { margin-bottom: 5px; font-weight: 500; }
    #status { margin: 15px 0; padding: 10px 20px; background: #222; border-radius: 20px; border: 1px solid #444; font-size: 14px; text-align: center; max-width: 90%; word-wrap: break-word; }
    .camera-box { position: relative; width: 100%; max-width: 500px; height: 375px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,255,0,0.8); color: black; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Class Attendance Verification</h2>
  <div id="status">Reading session parameters...</div>

  <div class="camera-box">
    <video id="video" autoplay muted playsinline></video>
  </div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9kOG2uQsKK5vflN0QzUpy9yu0SxWsfn6u3dU96AYXAumBptgjZigTQHHprCj5fG5WDA/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const TARGET_SHEET_ID = urlParams.get('targetSheet');

  let faceMatcher = null;
  let isScanning = false;

  async function init() {
    const status = document.getElementById('status');

    if (!TARGET_SHEET_ID) {
      status.innerText = "❌ Invalid Link! Missing session Sheet ID.";
      status.style.borderColor = "red";
      return;
    }

    try {
      status.innerText = "Loading AI Face Models...";
      await faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
      await faceapi.nets.faceLandmark64Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
      await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

      status.innerText = "Fetching enrolled students database...";
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getEnrolledStudents" })
      });
      const result = await response.json();

      if (!result.students || result.students.length === 0) {
        status.innerText = "⚠️ No students enrolled in the database yet.";
        return;
      }

      const labeledDescriptors = result.students.map(s => {
        return new faceapi.LabeledFaceDescriptors(
          `${s.rollNumber}___${s.name}`,
          [new Float32Array(s.descriptor)]
        );
      });

      // 0.5 distance threshold (lower = stricter match)
      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);

      status.innerText = "Starting Camera...";
      startCamera();
    } catch (err) {
      status.innerText = "Error initializing: " + err.message;
    }
  }

  function startCamera() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
        status.innerText = "📷 Align your face with the camera...";
        startDetectionLoop();
      })
      .catch(err => {
        status.innerText = "Camera Access Error: " + err.message;
      });
  }

  function startDetectionLoop() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    setInterval(async () => {
      if (isScanning || !faceMatcher) return;

      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

      if (detection) {
        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

        if (bestMatch.label !== 'unknown') {
          isScanning = true;
          const [rollNumber, name] = bestMatch.label.split('___');

          status.innerText = `Recognized: ${name} (${rollNumber}). Marking Attendance...`;
          await submitAttendance(rollNumber, name);
        }
      }
    }, 1200); // Scans every 1.2 seconds
  }

  async function submitAttendance(rollNumber, name) {
    const status = document.getElementById('status');

    const payload = {
      action: "markAttendance",
      data: {
        targetSheetId: TARGET_SHEET_ID,
        rollNumber: rollNumber,
        name: name
      }
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.success) {
        status.innerText = `✅ Attendance Marked for ${name} (${rollNumber})!`;
        status.style.borderColor = "green";
      } else {
        status.innerText = `⚠️ ${result.error}`;
        status.style.borderColor = "yellow";
      }
    } catch (err) {
      status.innerText = "Submission Error: " + err.message;
    } finally {
      // 4-second cooldown before attempting the next scan
      setTimeout(() => {
        isScanning = false;
        status.innerText = "📷 Looking for next face...";
        status.style.borderColor = "#444";
      }, 4000);
    }
  }

  window.onload = init;
</script>
</body>
</html>
