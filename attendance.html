<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mark Attendance</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h2 { font-size: 1.3rem; margin: 0 0 10px 0; color: #38bdf8; text-align: center; }
    .camera-box { position: relative; width: 100%; max-width: 380px; height: 320px; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #status { margin-top: 15px; width: 100%; max-width: 380px; padding: 14px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; text-align: center; font-size: 14px; min-height: 50px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <h2>Scan Face for Attendance</h2>
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <div id="status">Reading session parameters...</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGMbSUL8hDjh4uEav4xcpTt6saMxBqxXZP-XKN8N4Xs8JWJoyEuHuv8BdotUAOJ6p6ng/exec";
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
  const TARGET_SHEET_ID = new URLSearchParams(window.location.search).get('targetSheet');

  let faceMatcher = null;
  let isScanning = false;

  async function init() {
    const status = document.getElementById('status');

    if (!TARGET_SHEET_ID) {
      status.innerHTML = "<span style='color:#ef4444;'>Invalid Class Link! Ask CR for the updated link.</span>";
      return;
    }

    try {
      status.innerText = "Loading AI Recognition Models...";
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);

      status.innerText = "Fetching Enrolled Students Database...";
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getEnrolledStudents" })
      });
      const result = await response.json();

      if (!result.students || result.students.length === 0) {
        status.innerHTML = "<span style='color:#f59e0b;'>No students enrolled yet. Enroll via enroll.html first.</span>";
        return;
      }

      const labeledDescriptors = result.students.map(s => {
        return new faceapi.LabeledFaceDescriptors(
          `${s.rollNumber}___${s.name}`,
          [new Float32Array(s.descriptor)]
        );
      });

      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.48); // Strictly matched threshold
      status.innerText = "Starting Camera...";
      await startMobileCamera();
    } catch (err) {
      status.innerHTML = `<span style='color:#ef4444;'>Error initializing: ${err.message}</span>`;
    }
  }

  async function startMobileCamera() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      status.innerText = "📷 Hold phone steady & look into the camera...";
      startDetectionLoop();
    } catch (err) {
      status.innerHTML = "<span style='color:#ef4444;'>Camera access denied. Grant camera permissions in browser settings.</span>";
    }
  }

  function startDetectionLoop() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    setInterval(async () => {
      if (isScanning || !faceMatcher) return;

      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

      if (detection) {
        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

        if (bestMatch.label !== 'unknown') {
          isScanning = true;
          const [rollNumber, name] = bestMatch.label.split('___');

          status.innerText = `Recognized: ${name} (${rollNumber}). Submitting...`;
          await submitAttendance(rollNumber, name);
        }
      }
    }, 1000);
  }

  async function submitAttendance(rollNumber, name) {
    const status = document.getElementById('status');

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "markAttendance",
          data: { targetSheetId: TARGET_SHEET_ID, rollNumber, name }
        })
      });
      const result = await response.json();

      if (result.success) {
        status.innerHTML = `<span style='color:#22c55e; font-size:16px;'>✅ Marked Present: ${name} (${rollNumber})!</span>`;
      } else {
        status.innerHTML = `<span style='color:#f59e0b;'>⚠️ ${result.error}</span>`;
      }
    } catch (err) {
      status.innerHTML = `<span style='color:#ef4444;'>Network Error: ${err.message}</span>`;
    } finally {
      setTimeout(() => {
        isScanning = false;
        status.innerText = "📷 Hold phone steady & look into the camera...";
      }, 4000);
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
