<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CR Attendance Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; border: 1px solid #334155; }
    h2 { margin: 0 0 15px 0; font-size: 1.4rem; text-align: center; color: #38bdf8; }
    label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; display: block; }
    input { width: 100%; padding: 12px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    button { width: 100%; padding: 15px; background: #0284c7; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 18px; -webkit-tap-highlight-color: transparent; }
    button:disabled { background: #334155; cursor: not-allowed; }
    .result-box { margin-top: 20px; padding: 15px; background: #0f172a; border: 1px solid #0284c7; border-radius: 10px; display: none; }
    .result-box h4 { margin: 0 0 10px 0; color: #38bdf8; }
    a { color: #38bdf8; word-break: break-all; font-size: 14px; }
    .copy-btn { background: #0d9488; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>CR Session Portal</h2>
  
  <label>Course Name</label>
  <input type="text" id="course" placeholder="e.g. B.Tech Computer Science">

  <label>Subject</label>
  <input type="text" id="subject" placeholder="e.g. Operating Systems">

  <label>Semester</label>
  <input type="number" id="semester" placeholder="e.g. 4">

  <label>Class Date</label>
  <input type="date" id="date">

  <button id="genBtn" onclick="generateSession()">Generate Session Link</button>

  <div id="output" class="result-box">
    <h4>Session Created!</h4>
    <p style="font-size:13px;">Sheet: <a id="sheetLink" href="#" target="_blank">Open Sheet</a></p>
    <label>Student Attendance Link:</label>
    <input type="text" id="attendanceLink" readonly>
    <button class="copy-btn" onclick="copyLink()">Copy Link to Share</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGMbSUL8hDjh4uEav4xcpTt6saMxBqxXZP-XKN8N4Xs8JWJoyEuHuv8BdotUAOJ6p6ng/exec";
  document.getElementById('date').valueAsDate = new Date();

  async function generateSession() {
    const course = document.getElementById('course').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const semester = document.getElementById('semester').value.trim();
    const date = document.getElementById('date').value;
    const btn = document.getElementById('genBtn');

    if (!course || !subject || !semester || !date) {
      alert("Please complete all fields!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Creating Google Sheet...";

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "createSessionSheet",
          data: { course, subject, semester, date }
        })
      });
      const result = await response.json();

      if (result.success) {
        document.getElementById('output').style.display = 'block';
        document.getElementById('sheetLink').href = result.sheetUrl;
        
        const currentFolderUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const fullAttendanceUrl = `${currentFolderUrl}/attendance.html?targetSheet=${result.sheetId}`;
        
        document.getElementById('attendanceLink').value = fullAttendanceUrl;
      } else {
        alert("Error: " + result.error);
      }
    } catch (err) {
      alert("Network Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Generate Session Link";
    }
  }

  function copyLink() {
    const copyText = document.getElementById("attendanceLink");
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert("Attendance link copied! Send it to the WhatsApp group.");
  }
</script>
</body>
</html>
